            } else {
              lv_label_set_text(id(lbl_media_album), id(mp_album).state.c_str());
            }

  - platform: homeassistant
    id: mp_entity_picture
    entity_id: ${media_player_entity}
    attribute: entity_picture
    internal: true
    on_value:
      then:
        # Trigger album art update when entity_picture changes
        - delay: 2s  # Wait for automation to create new image
        - component.update: media_online_art

