#===============================================================

esphome:
  name: zrated-office
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
    board_build.flash_mode: dio
    board_upload.maximum_ram_size: 524288
  on_boot:
    priority: -100
    then:
      - delay: 1000ms
      - light.turn_on:
          id: display_backlight
          brightness: !lambda "return id(display_brightness_level).state / 100.0f;"
      - lambda: |-
          id(display_dimmed) = false;
          id(sleep_mode_active) = false;
          ESP_LOGI("startup", "Display backlight enabled on boot");

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
  flash_size: 8MB

logger:
  level: WARN

safe_mode:
  boot_is_good_after: 120s
  num_attempts: 3

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
          
  services:
    - service: notification_show
      then:
        - lambda: |-
            lv_obj_clear_flag(id(alert_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_opa(id(footer_bar), LV_OPA_50, 0);
        - light.turn_on: display_backlight
        - lvgl.resume:


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".7p.net"
  fast_connect: true
  reboot_timeout: 15min

mdns:
  disabled: false

ota:
  platform: esphome
  password: !secret ota_pass

bluetooth_proxy:
  active: true

psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO08
  scl: GPIO09
  id: bus_a

ch422g:
  - id: ch422g_hub

# Update in the time: section:
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /5
        then:
          - lambda: |-
              auto t = id(ha_time).now();
              char time_buf[6];
              sprintf(time_buf, "%02d:%02d", t.hour, t.minute);
              
              // Update main page time/date
              lv_label_set_text(id(lbl_time), time_buf);
              
              // Update all page header times with one line each
              lv_label_set_text(id(lbl_media_page_time), time_buf);
              lv_label_set_text(id(lbl_thermostat_page_time), time_buf);
              lv_label_set_text(id(lbl_automations_page_time), time_buf);
              lv_label_set_text(id(lbl_blinds_page_time), time_buf);
              lv_label_set_text(id(lbl_lights_page_time), time_buf);
              
              const char* days[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
              char date_buf[32];
              sprintf(date_buf, "%s, %02d/%02d", days[t.day_of_week - 1], t.month, t.day_of_month);
              lv_label_set_text(id(lbl_date), date_buf);

              // Update sleep clock page
              lv_label_set_text(id(lbl_sleep_time), time_buf); 

globals:
  - id: display_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sleep_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: "Timeout Dimming"
    id: timeout_dimming
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 2
    restore_value: yes
    unit_of_measurement: "min"
    mode: box

  - platform: template
    name: "Timeout Sleep"
    id: timeout_sleep
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 5
    restore_value: yes
    unit_of_measurement: "min"
    mode: box

  - platform: template
    name: "Display Brightness"
    id: display_brightness_level
    optimistic: true
    min_value: 1
    max_value: 100
    step: 10
    initial_value: 100
    restore_value: yes
    unit_of_measurement: "%"
    mode: slider
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(display_dimmed);'
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda "return x / 100.0f;"

  - platform: template
    name: "Display Dimming"
    id: display_dimming_level
    optimistic: true
    min_value: 1
    max_value: 100
    step: 10
    initial_value: 5
    restore_value: yes
    unit_of_measurement: "%"
    mode: slider

switch:
  - platform: template
    name: "Display Sleep Mode"
    id: display_sleep_mode
    optimistic: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:sleep"
    turn_on_action:
      - lambda: |-
          ESP_LOGI("sleep", "Entering sleep mode - showing clock overlay");
          id(sleep_mode_active) = true;
          lv_obj_clear_flag(id(sleep_clock_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(footer_bar), LV_OBJ_FLAG_HIDDEN);
    turn_off_action:
      - lambda: |-
          ESP_LOGI("sleep", "Exiting sleep mode - hiding clock overlay");
          id(sleep_mode_active) = false;
          id(display_dimmed) = false;
          lv_obj_add_flag(id(sleep_clock_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(footer_bar), LV_OBJ_FLAG_HIDDEN);
      - light.turn_on:
          id: display_backlight
          brightness: !lambda "return id(display_brightness_level).state / 100.0f;"

button:
  - platform: template
    name: "Show Notification"
    id: show_notification_btn
    on_press:
      - lambda: |-
          lv_obj_clear_flag(id(alert_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_opa(id(footer_bar), LV_OPA_50, 0);
      - light.turn_on: display_backlight
      - lvgl.resume:

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: my_display
    auto_clear_enabled: false
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    enable_pin:
      ch422g: ch422g_hub
      number: 2

touchscreen:
  platform: gt911
  id: my_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_release:
    - lambda: |-
        // Wake from sleep mode (clock page)
        if (id(sleep_mode_active)) {
          ESP_LOGI("touch", "Touch detected - waking from sleep mode");
          id(display_sleep_mode).turn_off();
          return;
        }
        
        // Wake from dim
        if (id(display_dimmed)) {
          ESP_LOGI("touch", "Touch detected - restoring brightness");
          id(display_dimmed) = false;
          auto call = id(display_backlight).turn_on();
          call.set_brightness(id(display_brightness_level).state / 100.0f);
          call.perform();
        }

output:
  - platform: ledc
    pin: GPIO44
    id: backlight_pwm
    frequency: 25000Hz
    min_power: 0.0
    zero_means_zero: true
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s
    gamma_correct: 1.0
    internal: true

