        ## Arc
        - arc:
            id: th_setpoint_arc
            align: CENTER
            y: 20
            width: 380
            height: 380
            arc_width: 18
            arc_color: 0x292929
            indicator:
              arc_color: 0x15499E
              arc_width: 18
