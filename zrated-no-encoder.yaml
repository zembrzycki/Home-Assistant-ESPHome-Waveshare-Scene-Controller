                      service: light.toggle
                      data:
                        entity_id: ${quick_btn_02_entity}
                on_long_press:
                  - homeassistant.service:
                      service: scene.turn_on
                      data:
                        entity_id: scene.all_lights_off
                widgets:
                  - label:
                      id: lbl_quick_btn_02
                      text: ${quick_btn_02_icon}
                      text_font: mdi_24

            # Quick Button 3 - Music Play/Pause
            - button:
                id: quick_btn_03
                bg_opa: TRANSP
                border_opa: TRANSP
                shadow_opa: TRANSP
                outline_opa: TRANSP
                on_short_click:
                  - homeassistant.service:
                      service: media_player.media_play_pause
                      data:
                        entity_id: ${quick_btn_03_entity}
                widgets:
                  - label:
                      id: lbl_quick_btn_03
                      text: ${quick_btn_03_icon}
                      text_font: mdi_24

            - button:
                id: page_home
                bg_opa: TRANSP
                border_opa: TRANSP
                shadow_opa: TRANSP
                outline_opa: TRANSP
                on_press:
                  then:
                    - lvgl.page.show: main_page
                widgets:
                  - label:
                      text: "\U000F06A1"
                      text_font: mdi_24

            - button:
                id: page_next
                bg_opa: TRANSP
                border_opa: TRANSP
                shadow_opa: TRANSP
                outline_opa: TRANSP
                on_press:
                  then:
                    - lvgl.page.next:
                widgets:
                  - label:
                      text: "\U000F0142"
                      text_font: mdi_24


      # Boot Screen (MUST BE LAST)
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0xCC9900
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: boot_logo
          on_press:
            - lvgl.widget.hide: boot_screen  
       
interval:
  - interval: 5s
    then:
      - lambda: |-
          // Skip if on sleep clock page already
          if (id(sleep_mode_active)) return;
          
          uint32_t idle_time = lv_disp_get_inactive_time(NULL);
          uint32_t dim_timeout_ms = (uint32_t)(id(timeout_dimming).state * 60000);
          uint32_t sleep_timeout_ms = (uint32_t)(id(timeout_sleep).state * 60000);
          
          // Check for sleep first
          if (sleep_timeout_ms > 0) {
            uint32_t total_sleep_time = (dim_timeout_ms > 0) ? (dim_timeout_ms + sleep_timeout_ms) : sleep_timeout_ms;
            if (idle_time >= total_sleep_time) {
              ESP_LOGI("idle", "Sleep timeout reached (%lu ms) - showing clock page", idle_time);
              id(display_sleep_mode).turn_on();
              return;
            }
          }
          
          // Check for dimming
          if (dim_timeout_ms > 0 && idle_time >= dim_timeout_ms && !id(display_dimmed)) {
            ESP_LOGI("idle", "Dim timeout reached (%lu ms) - dimming display", idle_time);
            id(display_dimmed) = true;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(id(display_dimming_level).state / 100.0f);
            call.perform();
          }
          
          // ---- Cellular Backup Indicator ----
          if (!id(router_isp_status).state.empty() && id(router_isp_status).state == "Verizon") {
            lv_obj_clear_flag(id(lbl_header_cellular), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_header_cellular), LV_OBJ_FLAG_HIDDEN);
          }
          
          // Bluetooth presence indicator
          if (!id(ble_device_area).state.empty() && id(ble_device_area).state == "${ble_presence_area}") {
            lv_obj_clear_flag(id(lbl_header_bluetooth), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_header_bluetooth), LV_OBJ_FLAG_HIDDEN);
          }
          
          // ---- Header Current Amps ----
          if (!isnan(id(header_current_amps_sensor).state)) {
            char amps_buf[16];
            snprintf(amps_buf, sizeof(amps_buf), "%.1f A", id(header_current_amps_sensor).state);
            lv_label_set_text(id(lbl_header_current_amps), amps_buf);
          } else {
            lv_label_set_text(id(lbl_header_current_amps), "-- A");
          }
          
          // ---- Lights ----
          auto update_light = [](auto status, auto btn, auto lbl) {
            if (status->state) {
              lv_obj_add_state(btn, LV_STATE_CHECKED);
              lv_label_set_text(lbl, "\U000F0335");
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xCC9900), 0);
            } else {
              lv_obj_clear_state(btn, LV_STATE_CHECKED);
              lv_label_set_text(lbl, "\U000F0336");
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
            }
          };
          update_light(id(light_status_01), id(btn_light_01), id(lbl_light_icon_01));
          update_light(id(light_status_02), id(btn_light_02), id(lbl_light_icon_02));
          update_light(id(light_status_03), id(btn_light_03), id(lbl_light_icon_03));
          update_light(id(light_status_04), id(btn_light_04), id(lbl_light_icon_04));
          update_light(id(light_status_05), id(btn_light_05), id(lbl_light_icon_05));
          update_light(id(light_status_06), id(btn_light_06), id(lbl_light_icon_06));

          // ---- Header Status Indicators (Global) ----
          if (id(light_status_01).state) lv_obj_clear_flag(id(lbl_header_kitchen_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_kitchen_light), LV_OBJ_FLAG_HIDDEN);
          
          if (id(light_status_02).state) lv_obj_clear_flag(id(lbl_header_living_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_living_light), LV_OBJ_FLAG_HIDDEN);
          
          if (id(light_status_03).state) lv_obj_clear_flag(id(lbl_header_dining_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_dining_light), LV_OBJ_FLAG_HIDDEN);
          
          if (id(light_status_04).state) lv_obj_clear_flag(id(lbl_header_office_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_office_light), LV_OBJ_FLAG_HIDDEN);
          
          if (id(light_status_05).state) lv_obj_clear_flag(id(lbl_header_bedroom_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_bedroom_light), LV_OBJ_FLAG_HIDDEN);
          
          if (id(light_status_06).state) lv_obj_clear_flag(id(lbl_header_bathroom_light), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_header_bathroom_light), LV_OBJ_FLAG_HIDDEN);

          // HVAC header status
          if (id(climate_hvac_action).state == "cooling") {
            lv_obj_clear_flag(id(lbl_header_hvac_cooling), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_header_hvac_heating), LV_OBJ_FLAG_HIDDEN);
          } else if (id(climate_hvac_action).state == "heating") {
            lv_obj_add_flag(id(lbl_header_hvac_cooling), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_header_hvac_heating), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_header_hvac_cooling), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_header_hvac_heating), LV_OBJ_FLAG_HIDDEN);
          }

          // ---- Covers / Shades ----
          auto update_cover = [](auto status, auto btn, auto lbl) {
            if (status->state == "open") {
              lv_obj_add_state(btn, LV_STATE_CHECKED);
              lv_label_set_text(lbl, "\U000F1011");
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xCC9900), 0);
            } else {
              lv_obj_clear_state(btn, LV_STATE_CHECKED);
              lv_label_set_text(lbl, "\U000F1A6C");
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
            }
          };
          update_cover(id(cover_status_01), id(btn_cover_01), id(lbl_cover_icon_01));
          update_cover(id(cover_status_02), id(btn_cover_02), id(lbl_cover_icon_02));
          update_cover(id(cover_status_03), id(btn_cover_03), id(lbl_cover_icon_03));

          // ---- Fans ----
          auto update_fan = [](auto status, auto btn, auto lbl) {
            if (status->state == "on") {
              lv_obj_add_state(btn, LV_STATE_CHECKED);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xCC9900), 0);
            } else {
              lv_obj_clear_state(btn, LV_STATE_CHECKED);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
            }
          };
          update_fan(id(fan_status_01), id(btn_fan_01), id(lbl_fan_icon_01));
          update_fan(id(fan_status_02), id(btn_fan_02), id(lbl_fan_icon_02));
          update_fan(id(fan_status_03), id(btn_fan_03), id(lbl_fan_icon_03));

          // ---- Weather ----
          char buf[64];

          // Outdoor temperature (actual, not feels like)
          if (!isnan(id(outdoor_temp).state)) {
            sprintf(buf, "Temperature: %.0f°F", id(outdoor_temp).state);
            lv_label_set_text(id(lbl_weather_temp), buf);
          } else {
            lv_label_set_text(id(lbl_weather_temp), "Temperature: --°F");
          }

          if (!isnan(id(weather_humidity)->state)) {
            sprintf(buf, "Humidity: %.0f%%", id(weather_humidity)->state);
            lv_label_set_text(id(lbl_weather_humidity), buf);
          }

          if (!isnan(id(weather_wind_speed)->state)) {
            if (!isnan(id(weather_wind_bearing)->state)) {
              sprintf(buf, "Wind: %.1f mph @ %.0f°", id(weather_wind_speed)->state, id(weather_wind_bearing)->state);
            } else {
              sprintf(buf, "Wind: %.1f mph", id(weather_wind_speed)->state);
            }
            lv_label_set_text(id(lbl_weather_wind), buf);
          }

          // pressure with trend
          if (!id(barometric_pressure_trend).state.empty()) {
            sprintf(buf, "Pressure: %s", id(barometric_pressure_trend).state.c_str());
            lv_label_set_text(id(lbl_weather_pressure), buf);
          } else {
            lv_label_set_text(id(lbl_weather_pressure), "Pressure: --");
          }

          // Tide information
          if (!id(noaa_tides).state.empty()) {
            lv_label_set_text(id(lbl_weather_tide), id(noaa_tides).state.c_str());
          } else {
            lv_label_set_text(id(lbl_weather_tide), "--");
          }

          if (!id(weather_condition)->state.empty()) {
            lv_label_set_text(id(lbl_weather_condition), id(weather_condition)->state.c_str());
            const char *icon = "\U000F0595";
            std::string cond = id(weather_condition)->state;
            if (cond == "sunny" || cond == "clear" || cond == "clearsky") icon = "\U000F0599";
            else if (cond == "partlycloudy" || cond == "partly_cloudy") icon = "\U000F0595";
            else if (cond == "cloudy") icon = "\U000F0590";
            else if (cond == "rainy" || cond == "light-rain" || cond == "rain") icon = "\U000F0597";
            else if (cond == "pouring" || cond == "heavy-rain") icon = "\U000F0596";
            else if (cond == "snowy" || cond == "snow") icon = "\U000F0598";
            else if (cond == "fog" || cond == "mist") icon = "\U000F0591";
            else if (cond == "clear-night" || cond == "night") icon = "\U000F0594";
            lv_label_set_text(id(lbl_weather_icon), icon);
          }

          // ---- Thermostat ----
          if (!isnan(id(climate_target_temp).state)) {
            int arc_val = (int)(id(climate_target_temp).state * 10);
            int current_arc_val = lv_arc_get_value(id(th_setpoint_arc));
            
            // Only update arc if not currently being touched AND value differs significantly
            if (!lv_obj_has_state(id(th_setpoint_arc), LV_STATE_PRESSED) && abs(current_arc_val - arc_val) > 5) {
              lv_arc_set_value(id(th_setpoint_arc), arc_val);
            }
            
            snprintf(buf, sizeof(buf), "%.1f°", id(climate_target_temp).state);
            lv_label_set_text(id(th_setpoint_label), buf);
          } else {
            lv_label_set_text(id(th_setpoint_label), "--.-°");
          }

          if (!isnan(id(climate_current_temp).state)) {
            snprintf(buf, sizeof(buf), "%.1f°", id(climate_current_temp).state);
            lv_label_set_text(id(th_temperature_label), buf);
          } else {
            lv_label_set_text(id(th_temperature_label), "--.-°");
          }

          if (!id(climate_hvac_action).state.empty()) {
            lv_label_set_text(id(th_action_label), id(climate_hvac_action).state.c_str());
          } else {
            lv_label_set_text(id(th_action_label), "--");
          }

          if (!id(climate_entity_state).state.empty()) {
            if (id(climate_entity_state).state == "heat") {
              lv_label_set_text(id(th_mode_label), "HEAT");
            } else if (id(climate_entity_state).state == "cool") {
              lv_label_set_text(id(th_mode_label), "COOL");
            } else {
              lv_label_set_text(id(th_mode_label), "OFF");
            }
          } else {
            lv_label_set_text(id(th_mode_label), "OFF");
          }

          // ---- Thermostat Arc Color & Mode Button Highlighting ----
          // Arc color: grey=off, orange=heat, blue=cool
          // Buttons: white=active, grey=inactive
          if (id(climate_entity_state).state == "off") {
            // Arc grey
            lv_obj_set_style_arc_color(id(th_setpoint_arc), lv_color_hex(0x666666), LV_PART_INDICATOR);
            // Off button white, others grey
            lv_obj_set_style_text_color(id(lbl_hvac_mode_off_icon), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_cool_icon), lv_color_hex(0x666666), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_heat_icon), lv_color_hex(0x666666), 0);
          } else if (id(climate_entity_state).state == "cool") {
            // Arc blue
            lv_obj_set_style_arc_color(id(th_setpoint_arc), lv_color_hex(0x15499E), LV_PART_INDICATOR);
            // Cool button white, others grey
            lv_obj_set_style_text_color(id(lbl_hvac_mode_off_icon), lv_color_hex(0x666666), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_cool_icon), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_heat_icon), lv_color_hex(0x666666), 0);
          } else if (id(climate_entity_state).state == "heat") {
            // Arc orange
            lv_obj_set_style_arc_color(id(th_setpoint_arc), lv_color_hex(0xFF6B35), LV_PART_INDICATOR);
            // Heat button white, others grey
            lv_obj_set_style_text_color(id(lbl_hvac_mode_off_icon), lv_color_hex(0x666666), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_cool_icon), lv_color_hex(0x666666), 0);
            lv_obj_set_style_text_color(id(lbl_hvac_mode_heat_icon), lv_color_hex(0xFFFFFF), 0);
          }

          // ---- HVAC Fan Button Update ----
          if (id(climate_fan_status).state) {
            lv_obj_add_state(id(btn_hvac_fan), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(lbl_hvac_fan_icon), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_clear_state(id(btn_hvac_fan), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(lbl_hvac_fan_icon), lv_color_hex(0x666666), 0);
          }

          // ---- Media Player text fields ----
          if (!id(mp_title).state.empty()) {
            lv_label_set_text(id(lbl_media_title), id(mp_title).state.c_str());
          } else {
            lv_label_set_text(id(lbl_media_title), "--");
          }

          if (!id(mp_artist).state.empty()) {
            lv_label_set_text(id(lbl_media_artist), id(mp_artist).state.c_str());
          } else {
            lv_label_set_text(id(lbl_media_artist), "--");
          }

          if (!id(mp_album).state.empty()) {
            lv_label_set_text(id(lbl_media_album), id(mp_album).state.c_str());
          } else {
            lv_label_set_text(id(lbl_media_album), "");
          }

          // ---- Utilities Page Updates ----
          char util_buf[128];
          
          if (!isnan(id(util_amps).state)) {
            snprintf(util_buf, sizeof(util_buf), "Amps: %.1f", id(util_amps).state);
            lv_label_set_text(id(lbl_util_amps), util_buf);
          } else {
            lv_label_set_text(id(lbl_util_amps), "Amps: --");
          }

          if (!isnan(id(util_chiller).state)) {
            snprintf(util_buf, sizeof(util_buf), "Chiller: %.1f°F", id(util_chiller).state);
            lv_label_set_text(id(lbl_util_chiller), util_buf);
          } else {
            lv_label_set_text(id(lbl_util_chiller), "Chiller: --");
          }

          if (!id(util_dehumidifier_action).state.empty()) {
            snprintf(util_buf, sizeof(util_buf), "Dehumidifier: %s", id(util_dehumidifier_action).state.c_str());
            lv_label_set_text(id(lbl_util_dehumidifier), util_buf);
          } else {
            lv_label_set_text(id(lbl_util_dehumidifier), "Dehumidifier: --");
          }

          // ---- Duke Switch ----
          if (id(duke_switch_status).state) {
            lv_obj_add_state(id(btn_auto_02), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(lbl_auto_icon_02), lv_color_hex(0xCC9900), 0);
          } else {
            lv_obj_clear_state(id(btn_auto_02), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(lbl_auto_icon_02), lv_color_hex(0xFFFFFF), 0);
          }

          // ---- Quick Button Updates ----
          // Button 1 - Office Blind (cover)
          if (id(quick_btn_01_status).state == "open") {
            lv_obj_add_state(id(quick_btn_01), LV_STATE_CHECKED);
            lv_label_set_text(id(lbl_quick_btn_01), "\U000F1011");
            lv_obj_set_style_text_color(id(lbl_quick_btn_01), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_clear_state(id(quick_btn_01), LV_STATE_CHECKED);
            lv_label_set_text(id(lbl_quick_btn_01), "\U000F1A6C");
            lv_obj_set_style_text_color(id(lbl_quick_btn_01), lv_color_hex(0xFFFFFF), 0);
          }

          // Button 2 - Office Light
          if (id(quick_btn_02_status).state) {
            lv_obj_add_state(id(quick_btn_02), LV_STATE_CHECKED);
            lv_label_set_text(id(lbl_quick_btn_02), "\U000F0335");
            lv_obj_set_style_text_color(id(lbl_quick_btn_02), lv_color_hex(0xFFFFFF), 0);
          } else {
            lv_obj_clear_state(id(quick_btn_02), LV_STATE_CHECKED);
            lv_label_set_text(id(lbl_quick_btn_02), "\U000F0336");
            lv_obj_set_style_text_color(id(lbl_quick_btn_02), lv_color_hex(0xFFFFFF), 0);
          }
