# ---- LVGL Config ----
lvgl:
  color_depth: 16
  displays:
    - my_display
  touchscreens:
    - my_touch
  buffer_size: 12%
  page_wrap: true

  theme:
    obj:
      border_width: 0
      border_opa: 0
      bg_color: 0x000000

    button:
      bg_color: 0x333333
      bg_grad_dir: VER
      text_color: 0xFFFFFF
      styles:
        - mdi_icon_off
      checked:
        bg_color: 0x333333
        text_color: 0xFFFFFF
        styles:
          - mdi_icon_on

  style_definitions:
    - id: header_style
      bg_color: 0x333333
      text_color: 0xFFFFFF
      border_width: 0
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 10
      width: 100%
      height: 48

    - id: footer_style
      bg_color: 0x333333
      text_color: 0xFFFFFF
      border_width: 0
      bg_grad_dir: VER
      pad_all: 6

    - id: page_style
      bg_color: 0x000000
      border_width: 0
      border_opa: 0
      pad_all: 0

    - id: mdi_icon_off
      text_color: 0xFFFFFF
    - id: mdi_icon_on
      text_color: 0xCC9900

  pages:
    # Main Page
    - id: main_page
      layout:
        type: flex
        flex_flow: column
        flex_align_main: start
        flex_align_cross: center
      bg_color: 0x000000
      on_gesture:
        then:
          - if:
              condition:
                lambda: |-
                  lv_dir_t dir = lv_indev_get_gesture_dir(lv_indev_get_act());
                  return dir == LV_DIR_LEFT;
              then:
                - lvgl.page.next:
          - if:
              condition:
                lambda: |-
                  lv_dir_t dir = lv_indev_get_gesture_dir(lv_indev_get_act());
                  return dir == LV_DIR_RIGHT;
              then:
                - lvgl.page.previous:
      widgets:
        # Header
        - obj:
            width: 100%
            height: 48
            align: top_mid
            styles: header_style
            layout:
              type: flex
              flex_flow: row
              flex_align_main: start
              flex_align_cross: center
            widgets:
              - label:
                  id: lbl_hastatus
                  text: "\U000F07D0"
                  text_font: mdi_24
                  hidden: true
                  text_color: 0xCCCCCC
                  x: 12
                  y: 0
              - label:
                  id: lbl_header_cellular
                  text: "\U000F08BE"
                  text_font: mdi_24
                  hidden: true
                  text_color: 0xCCCCCC
                  x: 42
                  y: 0
              - label:
                  id: lbl_header_bluetooth
                  text: "\U000F00AF"
                  text_font: mdi_24
                  hidden: true
                  text_color: 0xCCCCCC
                  x: 72
                  y: 0
              - label:
                  id: lbl_header_current_amps
                  text: "-- A"
                  text_font: roboto18
                  text_color: 0xCCCCCC
                  align: top_right
                  x: -10
                  y: 12
                
        # Main content row
        - obj:
            width: 100%
            flex_grow: 1
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
              pad_column: 5
              pad_row: 5
            bg_color: 0x000000
            widgets:
              # Left column (time)
              - obj:
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: start
                    pad_row: 5
                  width: 45%
                  flex_grow: 1
                  height: 100%
                  bg_color: 0x000000
                  widgets:
                    - label:
                        id: lbl_time
                        text_font: roboto64
                        text: "--:--"
                        text_align: left
                        text_color: 0xCCCCCC
                        on_release:
                          - switch.toggle: display_sleep_mode
                    - label:
                        id: lbl_date
                        text_font: roboto24
                        text: "-------, --/--"
                        text_align: left
                        text_color: 0xCCCCCC

              # Right column (weather)
              - obj:
                  layout:
                    type: grid
                    grid_rows: [FR(30), FR(12), FR(12), FR(12), FR(12), FR(12), FR(12)]
                    grid_columns: [FR(10), FR(40), FR(40), FR(10)]
                    pad_column: 0
                  width: 45%
                  flex_grow: 1
                  height: 100%
                  bg_color: 0x000000
                  widgets:
                    - label:
                        text: "\U000F14E4"
                        id: lbl_weather_icon
                        text_font: mdi_72
                        text_color: 0xCC9900
                        text_align: CENTER
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: CENTER
                        grid_cell_y_align: START
                    - label:
                        text: "--.- °F"
                        id: lbl_weather_temp
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 1
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                    - label:
                        text: "-- %"
                        id: lbl_weather_humidity
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 2
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                    - label:
                        text: "--"
                        id: lbl_weather_pressure
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 3
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                    - label:
                        text: "--"
                        id: lbl_weather_tide
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 4
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH  
                    - label:
                        text: "-- mph"
                        id: lbl_weather_wind
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 5
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                    - label:
                        text: ""
                        id: lbl_weather_condition
                        text_font: roboto24
                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 6
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                        hidden: true
        - obj:
            height: 54

    # Media Player Page
    - id: media_player_page
      bg_color: 0x000000
      on_gesture:
        then:
          - if:
              condition:
                lambda: |-
                  lv_dir_t dir = lv_indev_get_gesture_dir(lv_indev_get_act());
                  return dir == LV_DIR_LEFT;
              then:
                - lvgl.page.next:
          - if:
              condition:
                lambda: |-
                  lv_dir_t dir = lv_indev_get_gesture_dir(lv_indev_get_act());
                  return dir == LV_DIR_RIGHT;
              then:
                - lvgl.page.previous:
      widgets:
        # Header
        - obj:
            width: 100%
            height: 48
            styles: header_style
            widgets:
              - label:
                  text: 'Media' 
                  text_color: 0xCCCCCC
                  text_font: roboto24
                  text_align: left
                  x: 10
                  y: 0
              - label:
                  id: lbl_media_page_time
                  text: "--:--"
