    internal: true


sensor:
# ---- WiFi signal sensors ----
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    
  - platform: wifi_signal
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    update_interval: 60s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"

  # Outdoor Temperature (actual, not feels like)
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${outdoor_temperature}
    internal: true

 # ---- Weather attribute sensors ----   
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.beacon
    attribute: temperature
    internal: true

  - platform: homeassistant
    id: weather_humidity
    entity_id: weather.beacon
    attribute: humidity
    internal: true

  - platform: homeassistant
    id: weather_pressure
