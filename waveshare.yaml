            knob:
              bg_color: 0xFFFFFF
            value: 750
            min_value: 650
            max_value: 800
            adjustable: true
            on_value:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: ${climate_entity_01}
                    temperature: !lambda |-
                      int raw = lv_arc_get_value(id(th_setpoint_arc));
                      int rounded = ((raw + 2) / 5) * 5;
                      return (float)rounded / 10.0;

