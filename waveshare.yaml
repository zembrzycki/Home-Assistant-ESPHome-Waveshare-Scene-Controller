                        text_color: 0xCCCCCC
                        text_align: RIGHT
                        grid_cell_row_pos: 5
                        grid_cell_column_pos: 1
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                        hidden: true 
        - obj:
            height: 48

    # Lights Page
