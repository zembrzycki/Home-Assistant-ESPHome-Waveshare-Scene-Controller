substitutions:
  # Home Assistant URL
  ha_base_url: "http://10.10.10.9:8123"

  # Lights
  light_entity_01: "light.jasco_kitchen"
  light_entity_02: "light.sengled_living"
  light_entity_03: "light.levinton_dining"
  light_entity_04: "light.sengled_office"
  light_entity_05: "light.sengled_bedroom"
  light_entity_06: "light.levinton_bathroom"
  light_name_01: "Kitchen"
  light_name_02: "Living"
  light_name_03: "Dining"
  light_name_04: "Office"
  light_name_05: "Bedroom"
  light_name_06: "Bathroom"

  # Covers / Shades
  cover_entity_01:  "cover.somfy_bedroom"
  cover_entity_02:  "cover.somfy_office"
  cover_entity_03:  "cover.somfy_dining"
  cover_name_01: "Bedroom"
  cover_name_02: "Office"
  cover_name_03: "Dining"

  # Ceiling Fans
  fan_entity_01: "fan.fan_bedroom"
  fan_entity_02: "fan.fan_office"
  fan_entity_03: "fan.fan_dining"
  fan_name_01: "Bedroom"
  fan_name_02: "Office"
  fan_name_03: "Dining"

  # Climate
  climate_entity_01: "climate.nsp3_thermostat"
  hvac_fan_switch:   "switch.nsp3_relay_2"
  hvac_current:      "sensor.ac_current"
  hvac_chiller:      "sensor.hvac_supply_water_temperature"
  hvac_dehumidifier: "humidifier.dehumidifier"

  # Media Player
  media_player_entity: "media_player.kitchen"
  sonos_volume_down: "script.sonos_volume_down"
  sonos_volume_up: "script.sonos_volume_up"
  
  # Sonos Scripts
  sonos_script_01: "script.sonos_bpm"
  sonos_script_02: "script.sonos_chill"
  sonos_script_03: "script.sonos_elevations"
  sonos_name_01: "BPM"
  sonos_name_02: "Chill"
  sonos_name_03: "Elevations"

  # Automations
  automation_script_01: "script.roborock_clean"
  automation_switch_02: "switch.sengledpowerduke_fec66b03_on_off"
  automation_script_03: "scene.party"
  automation_script_04: "script.sonos_group_all"
  automation_name_01: "Start Cleaning"
  automation_name_02: "Duke Router"
  automation_name_03: "Scene: Party"
  automation_name_04: "Sonos Group All"

#===============================================================

esphome:
  name: waveshare1
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: -100  # Run after everything else is initialized
    then:
      - light.turn_on: display_backlight
      - lambda: |-
          ESP_LOGI("startup", "Display backlight enabled on boot");

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".7p.net"
  fast_connect: true
  reboot_timeout: 15min

captive_portal:

ota:
  platform: esphome
  password: !secret ota_pass


psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO08
  scl: GPIO09
  id: bus_a

ch422g:
  - id: ch422g_hub

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /5
        then:
          - lambda: |-
              auto t = id(ha_time).now();
              char buf[6];
              sprintf(buf, "%02d:%02d", t.hour, t.minute);
              lv_label_set_text(id(lbl_time), buf);

globals:
  - id: sleep_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: "Display Wake Timeout"
    id: wake_timeout
    optimistic: true
    min_value: 10
    max_value: 600
    step: 10
    initial_value: 120
    restore_value: yes
    unit_of_measurement: "s"
    mode: box

switch:
  - platform: template
    name: "Display Sleep Mode"
    id: display_sleep_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:sleep"
    turn_on_action:
      - lambda: |-
          ESP_LOGI("sleep", "Entering sleep mode - turning off backlight");
          id(sleep_mode_active) = true;
      - light.turn_off: display_backlight
      - lvgl.pause:
    turn_off_action:
      - lambda: |-
          ESP_LOGI("sleep", "Exiting sleep mode - turning on backlight");
          id(sleep_mode_active) = false;
      - light.turn_on: display_backlight
      - lvgl.resume:
      - lvgl.widget.redraw:

display:
  - platform: rpi_dpi_rgb
    id: my_display
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin: 5
    hsync_pin: 46
    vsync_pin: 3
    pclk_pin: 7
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    # REMOVE THIS:
    # enable_pin:
    #   ch422g: ch422g_hub
    #   number: 2
    data_pins:
      red: [1,2,42,41,40]
      green: [39,0,45,48,47,21]
      blue: [14,38,18,17,10]

touchscreen:
  platform: gt911
  id: my_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "Touch detected - resuming LVGL and backlight"
          - light.turn_on: display_backlight
          - lvgl.resume:
          - lvgl.widget.redraw:

output:
  - platform: gpio
    pin:
      ch422g: ch422g_hub
      number: 2
      mode: OUTPUT
      inverted: false
    id: backlight_gpio

light:
  - platform: binary
    id: display_backlight
    output: backlight_gpio
    internal: true 

font:
  - file: "gfonts://Roboto"
    id: roboto24
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: roboto36
    size: 36
    bpp: 4

  - file: "gfonts://Roboto"
    id: roboto48
    size: 48
    bpp: 4

  - file: "gfonts://Roboto"
    id: roboto64
    size: 64
    bpp: 4

  - file: "custom/MaterialDesignIconsDesktop.ttf"
    id: mdi_42
    size: 42
    bpp: 4
    glyphs: [
      "\U000F0335", # bulb on
      "\U000F0336", # bulb off
      "\U000F1A6C", # blinds closed
      "\U000F1011", # blinds open
      "\U000F05A9", # wifi
      "\U000F040E", # play/pause
      "\U000F075D", # vol +
      "\U000F075E", # vol - 
      "\U000F1473", # fan-speed-2
      "\U000F1797", # ceiling-fan
      "\U000F070D", # robot-vacuum
      "\U000F0469", # router-wireless
      "\U000F1056", # party-popper
      "\U000F0D38", # multiple-speaker
    ]

  - file: "custom/MaterialDesignIconsDesktop.ttf"
    id: mdi_72
    size: 72
    bpp: 4
    glyphs: [
      "\U000F0599", # weather sunny
      "\U000F0590", # cloudy
      "\U000F0597", # rainy
      "\U000F0596", # pouring
      "\U000F0598", # snowy
      "\U000F0595", # partly cloudy
      "\U000F059D", # windy
      "\U000F0591", # fog
      "\U000F0594", # night
    ]

http_request:
  timeout: 10s

image:
  - id: boot_logo
    file: "custom/logo.bmp"
    type: RGB565
    resize: 200x200

  - id: media_blank_art
    file: "custom/blank_album.bmp"
    type: RGB565
    resize: 200x200

online_image:
  - id: media_online_art
    type: RGB565
    format: BMP
    url: "${ha_base_url}/local/media_album.bmp"
    update_interval: never
    on_download_finished:
      - lambda: |-
          ESP_LOGI("media", "✓ BMP downloaded, updating display");
          auto img = id(media_album_widget);
          if (img != nullptr) {
            lv_img_set_src(img, id(media_online_art).get_lv_img_dsc());
            lv_obj_invalidate(img);
          }
    on_error:
      - lambda: |-
          ESP_LOGW("media", "✗ Download failed");

